name: SonarQube

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    name: Construir y analizar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CatalogoParametrosUcoLab
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Verificar disponibilidad de SONAR_TOKEN
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "::error::SONAR_TOKEN no esta disponible en esta ejecucion. Revisa el secreto de Actions del repositorio y si el PR proviene de un fork o de Dependabot."
            exit 1
          fi
          echo "SONAR_TOKEN esta disponible; su validez y permisos se comprobaran durante el analisis."

      - name: Configurar JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Cache de paquetes SonarQube
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache de paquetes Maven
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Construir y analizar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar -Dsonar.projectKey=simoncardenasramirez_CatalogoParametros
