services:

  # ==========================================
  # APP - Spring Boot
  # ==========================================
  app:
    container_name: catalogo-parametros-app
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: catalogo-parametros

      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"

      # OTLP Metrics (Micrometer registry) - use env vars for higher precedence
      MANAGEMENT_METRICS_EXPORT_OTLP_ENABLED: "true"
      MANAGEMENT_METRICS_EXPORT_OTLP_URL: "http://otel-collector:4318/v1/metrics"
      MANAGEMENT_METRICS_EXPORT_OTLP_STEP: "1m"

      # OpenTelemetry (traces only - NOT metrics)
      OTEL_SERVICE_NAME: catalogo-parametros

      # Azure
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}

      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"

    networks:
      - monitoring

    depends_on:
      - otel-collector


  # ==========================================
  # PROMETHEUS - Metrics
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    networks:
      - monitoring


  # ==========================================
  # GRAFANA
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana

    ports:
      - "3000:3000"

    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
      - grafana-data:/var/lib/grafana

    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"

    networks:
      - monitoring

    depends_on:
      - prometheus
      - loki
      - jaeger


  # ==========================================
  # SURREALDB
  # ==========================================
  surrealdb:
    image: surrealdb/surrealdb:latest
    container_name: surrealdb

    ports:
      - "8000:8000"

    command:
      - start
      - --user
      - root
      - --pass
      - root
      - rocksdb:/surrealdb-data/database.db

    volumes:
      - ./surrealdb-data:/surrealdb-data

    networks:
      - monitoring


  # ==========================================
  # OPENTELEMETRY COLLECTOR
  # ==========================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.105.0
    container_name: otel-collector

    command:
      - "--config=/etc/otel-collector-config.yaml"

    ports:
      # OTLP gRPC
      - "4317:4317"

      # OTLP HTTP
      - "4318:4318"

      # Collector metrics
      - "8888:8888"

      # Prometheus exporter
      - "8889:8889"

      # Health check
      - "13133:13133"

      # pprof
      - "1777:1777"

      # zPages
      - "55679:55679"

    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro

    networks:
      - monitoring

    depends_on:
      - jaeger
      - loki


  # ==========================================
  # JAEGER - Distributed Tracing
  # ==========================================
  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: jaeger

    ports:
      # Jaeger UI
      - "16686:16686"

      # Jaeger gRPC
      - "14250:14250"

      # Jaeger HTTP
      - "14268:14268"

    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: 100000

    networks:
      - monitoring


  # ==========================================
  # LOKI - Logs
  # ==========================================
  loki:
    image: grafana/loki:3.7.2
    container_name: loki

    ports:
      - "3100:3100"

    command:
      - "-config.file=/etc/loki/local-config.yaml"

    networks:
      - monitoring


  # ==========================================
  # PROMTAIL - Docker Logs → Loki
  # ==========================================
  promtail:
    image: grafana/promtail:2.9.3
    container_name: promtail

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yaml:/etc/promtail/config.yaml:ro

    command:
      - "-config.file=/etc/promtail/config.yaml"

    networks:
      - monitoring

    depends_on:
      - loki


# ==========================================
# NETWORK
# ==========================================
networks:
  monitoring:
    driver: bridge


# ==========================================
# VOLUMES
# ==========================================
volumes:
  grafana-data:
