        '500': { $ref: '#/components/responses/InternalError' }
  /catalogo-parametros/api/v1/tipos-parametro/{id}:
    get:
      tags: [Tipos de parámetro]
      operationId: consultarTipoParametroPorId
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/TiposParametroOk' }
        '404': { $ref: '#/components/responses/NotFound' }
