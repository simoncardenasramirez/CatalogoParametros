openapi: 3.0.3
info:
  title: Catálogo de Parámetros UcoLab
  version: 1.0.0
  description: |
    Contrato público y versionado del módulo Catálogo de Parámetros.
    Este archivo es la fuente de verdad para productores y consumidores.
servers:
  - url: http://localhost:8080
    description: Desarrollo local
tags:
  - name: Organizaciones
  - name: Aplicaciones
  - name: Módulos
  - name: Funcionalidades
  - name: Parámetros
  - name: Metadatos
  - name: Tipos de parámetro
  - name: Tipos de metadato

paths:
  /catalogo-parametros/api/v1/organizaciones:
    get:
      tags: [Organizaciones]
      operationId: consultarOrganizaciones
      summary: Consulta organizaciones paginadas
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/OrganizacionesOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Organizaciones]
      operationId: crearOrganizacion
      summary: Crea una organización
      requestBody:
        $ref: '#/components/requestBodies/OrganizacionRequest'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /catalogo-parametros/api/v1/organizaciones/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Organizaciones]
      operationId: consultarOrganizacionPorId
      responses:
        '200': { $ref: '#/components/responses/OrganizacionesOk' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Organizaciones]
      operationId: actualizarOrganizacion
      requestBody:
        $ref: '#/components/requestBodies/OrganizacionRequest'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Organizaciones]
      operationId: eliminarOrganizacion
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /catalogo-parametros/api/v1/organizaciones/events:
    get:
      tags: [Organizaciones]
      operationId: observarEventosOrganizacion
      summary: Flujo SSE de cambios de organizaciones
      responses:
        '200': { $ref: '#/components/responses/EventStream' }

  /catalogo-parametros/api/v1/aplicaciones:
    get:
      tags: [Aplicaciones]
      operationId: consultarAplicaciones
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/AplicacionesOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Aplicaciones]
      operationId: crearAplicacion
      requestBody: { $ref: '#/components/requestBodies/AplicacionRequest' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /catalogo-parametros/api/v1/aplicaciones/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Aplicaciones]
      operationId: consultarAplicacionPorId
      responses:
        '200': { $ref: '#/components/responses/AplicacionesOk' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Aplicaciones]
      operationId: actualizarAplicacion
      requestBody: { $ref: '#/components/requestBodies/AplicacionRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Aplicaciones]
      operationId: eliminarAplicacion
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /catalogo-parametros/api/v1/aplicaciones/events:
    get:
      tags: [Aplicaciones]
      operationId: observarEventosAplicacion
      responses:
        '200': { $ref: '#/components/responses/EventStream' }
  /catalogo-parametros/api/v1/aplicaciones/{id}/cambiarestado:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Aplicaciones]
      operationId: cambiarEstadoAplicacion
      summary: Cambia únicamente el estado activo de la aplicación
      requestBody: { $ref: '#/components/requestBodies/CambiarEstadoRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /catalogo-parametros/api/v1/modulos:
    get:
      tags: [Módulos]
