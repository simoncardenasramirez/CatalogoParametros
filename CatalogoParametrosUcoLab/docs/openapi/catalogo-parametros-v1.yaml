components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identificador UUID del recurso
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      description: Página basada en uno; valores menores que uno se normalizan a uno
      schema: { type: integer, default: 1 }
    PageSize:
      name: pageSize
      in: query
      description: Cantidad de registros solicitados; valores menores que uno se normalizan a uno
      schema: { type: integer, default: 10 }
    IdParametroFiltro:
      name: idParametro
      in: query
      required: false
      description: Filtra metadatos por el UUID de un parámetro. Sin filtro devuelve todos, sin paginación.
      schema: { type: string, format: uuid }
  requestBodies:
    CambiarEstadoRequest:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CambiarEstadoRequest' }
    OrganizacionRequest:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrganizacionRequest' }
    AplicacionRequest:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AplicacionRequest' }
    ModuloRequest:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ModuloRequest' }
    FuncionalidadRequest:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FuncionalidadRequest' }
    ParametroRequest:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ParametroRequest' }
    MetadatoRequest:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MetadatoRequest' }
    AmbienteRequest:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AmbienteRequest' }
    EstadoAmbienteRequest:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EstadoAmbienteRequest' }
    EstadoMetadatoAmbienteRequest:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EstadoMetadatoAmbienteRequest' }
    MetadatoAmbienteRequest:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MetadatoAmbienteRequest' }
  responses:
    BadRequest:
      description: Petición inválida o regla de negocio incumplida
      content: { application/json: { schema: { $ref: '#/components/schemas/MessageResponse' } } }
    NotFound:
      description: Recurso no encontrado
      content: { application/json: { schema: { $ref: '#/components/schemas/MessageResponse' } } }
    Conflict:
      description: Conflicto con el estado actual del catálogo
      content: { application/json: { schema: { $ref: '#/components/schemas/MessageResponse' } } }
    InternalError:
      description: Error técnico no esperado
      content: { application/json: { schema: { $ref: '#/components/schemas/MessageResponse' } } }
    OrganizacionesOk: { description: Organizaciones encontradas, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizacionResponse' } } } }
    AplicacionesOk: { description: Aplicaciones encontradas, content: { application/json: { schema: { $ref: '#/components/schemas/AplicacionResponse' } } } }
    ModulosOk: { description: Módulos encontrados, content: { application/json: { schema: { $ref: '#/components/schemas/ModuloResponse' } } } }
    FuncionalidadesOk: { description: Funcionalidades encontradas, content: { application/json: { schema: { $ref: '#/components/schemas/FuncionalidadResponse' } } } }
    ParametrosOk: { description: Parámetros encontrados, content: { application/json: { schema: { $ref: '#/components/schemas/ParametroResponse' } } } }
    MetadatosOk: { description: Metadatos encontrados, content: { application/json: { schema: { $ref: '#/components/schemas/MetadatoResponse' } } } }
    TiposParametroOk: { description: Tipos encontrados, content: { application/json: { schema: { $ref: '#/components/schemas/TipoParametroResponse' } } } }
    TiposMetadatoOk: { description: Tipos encontrados, content: { application/json: { schema: { $ref: '#/components/schemas/TipoMetadatoResponse' } } } }
    AmbienteEventStream:
      description: |
        Flujo SSE continuo. Escuchar el evento ambiente.
        Cada campo data contiene un JSON conforme a AmbienteEvent.
        event dentro del JSON indica CREATED, UPDATED o DELETED.
        Cada publisher conserva los ?ltimos 100 eventos en memoria y los reproduce al suscribirse.
        No hay id SSE ni soporte de Last-Event-ID; no se garantiza orden global entre publishers.
        El historial se pierde al reiniciar la aplicaci?n.
      content:
        text/event-stream:
          schema: { type: string }
          x-event-data-schema: { $ref: '#/components/schemas/AmbienteEvent' }
          example: ":connected\n\nevent: ambiente\ndata: {\"ambiente\":{\"id\":\"123e4567-e89b-12d3-a456-426614174000\",\"nombre\":\"Ejemplo\"},\"event\":\"CREATED\"}\n\n"
