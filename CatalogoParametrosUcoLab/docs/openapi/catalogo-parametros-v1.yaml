openapi: 3.0.3
info:
  title: Catálogo de Parámetros UcoLab
  version: 1.0.0
  description: |
    Contrato público y versionado del módulo Catálogo de Parámetros.
    Este archivo es la fuente de verdad para productores y consumidores.
    Todas las fechas y horas se normalizan a UTC (sufijo Z), conservando el instante.
    La vigencia es [fechaInicio, fechaFinal): el instante final ya no permite uso.
    Aplicaciones, modulos, funcionalidades, parametros, tokens y asociaciones por
    ambiente conservan sus estados existentes. La desactivacion se propaga a
    dependientes; no se agregan estados a organizaciones, ambientes ni metadatos.
    Las consultas administrativas conservan los inactivos. Crear relaciones o
    activar registros con padres inactivos o fuera de vigencia devuelve 400.
    La reactivacion es individual y exige padres disponibles y vigencia valida.
servers:
  - url: http://localhost:8080
    description: Desarrollo local
tags:
  - name: Organizaciones
  - name: Aplicaciones
  - name: Módulos
  - name: Funcionalidades
  - name: Parámetros
  - name: Metadatos
  - name: Tipos de parámetro
  - name: Tipos de metadato
  - name: Ambientes
  - name: Estados de ambiente
  - name: Estados de metadato de ambiente
  - name: Metadatos de ambiente
  - name: Tokens
  - name: Estados de token

paths:
  /catalogo-parametros/api/v1/organizaciones:
