openapi: 3.0.3
info:
  title: Catálogo de Parámetros UcoLab
  version: 1.2.0
  description: API administrativa y consumo servidor a servidor por identidad de servicio.
servers:
  - url: http://localhost:8081
    description: Laboratorio local
paths:
  /catalogo-parametros/api/v1/parametros/consulta/m2m:
    get:
      tags: [Consumo M2M]
      operationId: consultarParametrosPorIdentidadServicio
      summary: Consulta parámetros del ambiente asociado a la identidad
      description: El PEP valida el JWT y el Catálogo resuelve el alcance desde el client_id asociado.
      security:
        - bearerAuth: []
      parameters:
        - name: nombre
          in: query
          required: false
          description: Filtra por el nombre exacto del parámetro, sin distinguir mayúsculas y minúsculas.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Parámetros del único ambiente autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParametrosConsumidorResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /catalogo-parametros/api/v1/aplicaciones/{idAplicacion}/identidades-servicio:
    post:
      tags: [Identidades de servicio]
      operationId: asociarIdentidadServicio
      summary: Asocia un client_id a un ambiente de la aplicación
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ambienteId, clientId]
              properties:
                ambienteId: { type: string, format: uuid }
                clientId: { type: string, minLength: 1 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /catalogo-parametros/api/v1/aplicaciones/{idAplicacion}/administracion:
    get:
      tags: [Administración embebida]
      operationId: consultarCatalogoAplicacion
      summary: Consulta toda la configuración de una aplicación
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieSession:
      type: apiKey
      in: cookie
      name: SECURITY_BASELINE_SESSION
  parameters:
    ApplicationId:
      name: idAplicacion
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    ParametrosConsumidorResponse:
      type: object
      required: [aplicacion, ambiente, parametros]
      properties:
        aplicacion: { type: object, nullable: true }
        ambiente: { type: object, nullable: true }
        parametros:
          type: array
          items: { type: object }
    MessageResponse:
      type: object
      properties:
        mensajes: { type: array, items: { type: string } }
  responses:
    Success:
      description: Operación exitosa
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MessageResponse' }
    Unauthorized:
      description: Autenticación ausente o inválida
    Forbidden:
      description: Permiso o asociación insuficiente
