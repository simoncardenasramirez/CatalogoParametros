    post:
      tags: [Módulos]
      operationId: cambiarEstadoModulo
      summary: Cambia únicamente el estado activo del módulo
      requestBody: { $ref: '#/components/requestBodies/CambiarEstadoRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
