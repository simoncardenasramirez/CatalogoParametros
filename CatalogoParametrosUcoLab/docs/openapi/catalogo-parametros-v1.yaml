        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /catalogo-parametros/api/v1/modulos/events:
    get:
      tags: [Módulos]
      operationId: observarEventosModulo
