    get:
      tags: [Metadatos]
      operationId: consultarMetadatoPorId
      responses:
        '200': { $ref: '#/components/responses/MetadatosOk' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Metadatos]
      operationId: actualizarMetadato
      requestBody: { $ref: '#/components/requestBodies/MetadatoRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
