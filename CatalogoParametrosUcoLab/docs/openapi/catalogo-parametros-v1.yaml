    get:
      tags: [Tipos de metadato]
      operationId: consultarTipoMetadatoPorId
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/TiposMetadatoOk' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identificador UUID del recurso
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      description: Página basada en uno
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      description: Cantidad máxima de registros solicitados
      schema: { type: integer, minimum: 1, default: 10 }
  requestBodies:
    CambiarEstadoRequest:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CambiarEstadoRequest' }
    OrganizacionRequest:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrganizacionRequest' }
    AplicacionRequest:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AplicacionRequest' }
    ModuloRequest:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ModuloRequest' }
    FuncionalidadRequest:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FuncionalidadRequest' }
    ParametroRequest:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ParametroRequest' }
    MetadatoRequest:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MetadatoRequest' }
  responses:
    Success:
      description: Operación exitosa
      content: { application/json: { schema: { $ref: '#/components/schemas/MessageResponse' } } }
    Created:
      description: Recurso creado
      content: { application/json: { schema: { $ref: '#/components/schemas/MessageResponse' } } }
    BadRequest:
      description: Petición inválida o regla de negocio incumplida
      content: { application/json: { schema: { $ref: '#/components/schemas/MessageResponse' } } }
    NotFound:
      description: Recurso no encontrado
      content: { application/json: { schema: { $ref: '#/components/schemas/MessageResponse' } } }
    Conflict:
      description: Conflicto con el estado actual del catálogo
      content: { application/json: { schema: { $ref: '#/components/schemas/MessageResponse' } } }
    InternalError:
      description: Error técnico no esperado
      content: { application/json: { schema: { $ref: '#/components/schemas/MessageResponse' } } }
    EventStream:
      description: Conexión SSE. El campo `event` del JSON vale CREATED, UPDATED o DELETED.
      content:
        text/event-stream:
          schema: { type: string }
          example: "event: parametro\ndata: {\"parametro\":{\"id\":\"123e4567-e89b-12d3-a456-426614174000\",\"nombre\":\"idioma\",\"idFuncionalidad\":\"123e4567-e89b-12d3-a456-426614174001\",\"idTipoParametro\":\"123e4567-e89b-12d3-a456-426614174002\",\"activo\":true},\"event\":\"CREATED\"}\n\n"
    OrganizacionesOk: { description: Organizaciones encontradas, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizacionResponse' } } } }
    AplicacionesOk: { description: Aplicaciones encontradas, content: { application/json: { schema: { $ref: '#/components/schemas/AplicacionResponse' } } } }
    ModulosOk: { description: Módulos encontrados, content: { application/json: { schema: { $ref: '#/components/schemas/ModuloResponse' } } } }
    FuncionalidadesOk: { description: Funcionalidades encontradas, content: { application/json: { schema: { $ref: '#/components/schemas/FuncionalidadResponse' } } } }
    ParametrosOk: { description: Parámetros encontrados, content: { application/json: { schema: { $ref: '#/components/schemas/ParametroResponse' } } } }
    MetadatosOk: { description: Metadatos encontrados, content: { application/json: { schema: { $ref: '#/components/schemas/MetadatoResponse' } } } }
    TiposParametroOk: { description: Tipos encontrados, content: { application/json: { schema: { $ref: '#/components/schemas/TipoParametroResponse' } } } }
    TiposMetadatoOk: { description: Tipos encontrados, content: { application/json: { schema: { $ref: '#/components/schemas/TipoMetadatoResponse' } } } }
  schemas:
    CambiarEstadoRequest:
      type: object
      required: [activo]
      properties:
        activo: { type: boolean, example: false }
    Uuid:
      type: string
      format: uuid
      example: 123e4567-e89b-12d3-a456-426614174000
    InputUuid:
      type: string
      format: uuid
      description: Los DTO actuales reciben el UUID como cadena JSON.
      example: 123e4567-e89b-12d3-a456-426614174000
    InputBoolean:
      type: string
      enum: ['true', 'false']
      default: 'true'
      description: Los DTO actuales reciben el booleano como cadena JSON.
    InputDateTime:
      type: string
      format: date-time
      description: Fecha y hora ISO-8601 con desplazamiento obligatorio; se recomienda enviar la zona de Colombia como -05:00.
      example: '2026-09-11T08:30:00-05:00'
    MessageResponse:
      type: object
      required: [mensajes]
      properties:
        mensajes: { type: array, items: { type: string } }
    OrganizacionRequest:
      type: object
      additionalProperties: false
      required: [nombre, fechaInicio, fechaFinal]
      properties:
        nombre: { type: string, minLength: 1, example: UCO }
        fechaInicio: { $ref: '#/components/schemas/InputDateTime' }
        fechaFinal: { $ref: '#/components/schemas/InputDateTime' }
    AplicacionRequest:
      type: object
      additionalProperties: false
      required: [nombre, idOrganizacion, activa, fechaInicio, fechaFinal]
      properties:
        nombre: { type: string, minLength: 1, example: UcoLab }
        idOrganizacion: { $ref: '#/components/schemas/InputUuid' }
