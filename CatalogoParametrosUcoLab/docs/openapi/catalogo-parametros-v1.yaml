  /catalogo-parametros/api/v1/metadatos:
    get:
      tags: [Metadatos]
      operationId: consultarMetadatos
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses:
        '200': { $ref: '#/components/responses/MetadatosOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
