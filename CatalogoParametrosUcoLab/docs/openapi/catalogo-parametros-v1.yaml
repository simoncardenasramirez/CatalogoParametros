          example: ":connected\n\nevent: parametro\ndata: {\"parametro\":{\"id\":\"123e4567-e89b-12d3-a456-426614174000\",\"nombre\":\"Ejemplo\",\"idFuncionalidad\":\"123e4567-e89b-12d3-a456-426614174001\",\"idTipoParametro\":\"123e4567-e89b-12d3-a456-426614174001\",\"activo\":true},\"event\":\"CREATED\"}\n\n"
  schemas:
    CambiarEstadoRequest:
      type: object
      required: [activo]
      properties:
        activo: { type: boolean, example: false }
    Uuid:
      type: string
      format: uuid
      example: 123e4567-e89b-12d3-a456-426614174000
    InputUuid:
      type: string
      format: uuid
      description: Los DTO actuales reciben el UUID como cadena JSON.
      example: 123e4567-e89b-12d3-a456-426614174000
    InputBoolean:
      type: string
      enum: ['true', 'false']
      default: 'true'
      description: Los DTO actuales reciben el booleano como cadena JSON.
    InputDateTime:
      oneOf:
        - { type: string, format: date-time }
        - { type: string, enum: [""] }
      description: Fecha opcional ISO-8601 con desplazamiento (por ejemplo -05:00 o Z). Puede omitirse. Una cadena vacía se interpreta como ausencia de fecha. Si ambas fechas existen, fechaFinal no puede ser anterior a fechaInicio.
      example: '2026-09-11T08:30:00-05:00'
    MessageResponse:
      type: object
      required: [mensajes]
      properties:
        mensajes: { type: array, items: { type: string } }
    OrganizacionRequest:
      type: object
      additionalProperties: false
      required: [nombre]
      properties:
        nombre: { type: string, minLength: 3, maxLength: 50, example: UCO }
        fechaInicio: { $ref: '#/components/schemas/InputDateTime' }
        fechaFinal: { $ref: '#/components/schemas/InputDateTime' }
    AplicacionRequest:
      type: object
      additionalProperties: false
      required: [nombre, idOrganizacion, activa]
      properties:
        nombre: { type: string, minLength: 3, maxLength: 50, example: UcoLab }
        idOrganizacion: { $ref: '#/components/schemas/InputUuid' }
        activa: { $ref: '#/components/schemas/InputBoolean' }
        fechaInicio: { $ref: '#/components/schemas/InputDateTime' }
        fechaFinal: { $ref: '#/components/schemas/InputDateTime' }
    ModuloRequest:
      type: object
      additionalProperties: false
      required: [nombre, idAplicacion, activo]
      properties:
        nombre: { type: string, minLength: 3, maxLength: 50, example: Matrículas }
        idAplicacion: { $ref: '#/components/schemas/InputUuid' }
        activo: { $ref: '#/components/schemas/InputBoolean' }
        fechaInicio: { $ref: '#/components/schemas/InputDateTime' }
        fechaFinal: { $ref: '#/components/schemas/InputDateTime' }
    FuncionalidadRequest:
      type: object
      additionalProperties: false
      required: [nombre, idModulo, activo]
      properties:
        nombre: { type: string, minLength: 3, maxLength: 50, example: Crear matrícula }
        idModulo: { $ref: '#/components/schemas/InputUuid' }
        activo: { $ref: '#/components/schemas/InputBoolean' }
        fechaInicio: { $ref: '#/components/schemas/InputDateTime' }
        fechaFinal: { $ref: '#/components/schemas/InputDateTime' }
    ParametroRequest:
      type: object
      additionalProperties: false
      required: [nombre, idFuncionalidad, idTipoParametro, activo]
      properties:
        nombre: { type: string, minLength: 3, maxLength: 50, example: idioma }
        idFuncionalidad: { $ref: '#/components/schemas/InputUuid' }
        idTipoParametro: { $ref: '#/components/schemas/InputUuid' }
        activo: { $ref: '#/components/schemas/InputBoolean' }
    MetadatoRequest:
      type: object
      additionalProperties: false
      required: [idParametro, idTipoMetadato, valor]
      properties:
        idParametro: { $ref: '#/components/schemas/InputUuid' }
        idTipoMetadato: { $ref: '#/components/schemas/InputUuid' }
        valor:
          description: JSON cuyo tipo debe coincidir con el tipo de metadato asociado.
    Organizacion:
      type: object
      required: [id, nombre]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        nombre: { type: string }
        fechaInicio: { type: string, format: date-time, nullable: true, example: '2026-09-11T13:30:00Z' }
        fechaFinal: { type: string, format: date-time, nullable: true, example: '2026-12-31T04:59:59Z' }
    Aplicacion:
      type: object
      required: [id, nombre, idOrganizacion, activa]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        nombre: { type: string }
        idOrganizacion: { $ref: '#/components/schemas/Uuid' }
        activa: { type: boolean }
        fechaInicio: { type: string, format: date-time, nullable: true, example: '2026-09-11T13:30:00Z' }
        fechaFinal: { type: string, format: date-time, nullable: true, example: '2026-12-31T04:59:59Z' }
    Modulo:
      type: object
      required: [id, nombre, idAplicacion, activo]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        nombre: { type: string }
        idAplicacion: { $ref: '#/components/schemas/Uuid' }
        activo: { type: boolean }
        fechaInicio: { type: string, format: date-time, nullable: true, example: '2026-09-11T13:30:00Z' }
        fechaFinal: { type: string, format: date-time, nullable: true, example: '2026-12-31T04:59:59Z' }
    Funcionalidad:
      type: object
      required: [id, nombre, idModulo, activo]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        nombre: { type: string }
        idModulo: { $ref: '#/components/schemas/Uuid' }
        activo: { type: boolean }
        fechaInicio: { type: string, format: date-time, nullable: true, example: '2026-09-11T13:30:00Z' }
        fechaFinal: { type: string, format: date-time, nullable: true, example: '2026-12-31T04:59:59Z' }
    Parametro:
      type: object
      required: [id, nombre, idFuncionalidad, idTipoParametro, activo]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        nombre: { type: string }
        idFuncionalidad: { $ref: '#/components/schemas/Uuid' }
        idTipoParametro: { $ref: '#/components/schemas/Uuid' }
        activo: { type: boolean }
    Metadato:
      type: object
      required: [id, idParametro, idTipoMetadato, valor]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        idParametro: { $ref: '#/components/schemas/Uuid' }
        idTipoMetadato: { $ref: '#/components/schemas/Uuid' }
        valor: { description: Valor JSON tipado por idTipoMetadato }
    TipoParametro:
      type: object
      required: [id, nombre]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        nombre: { type: string }
    TipoMetadato:
      type: object
      required: [id, tipo, detalle]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        tipo: { type: string, example: STRING }
        detalle: { type: string }
    OrganizacionResponse: { allOf: [{ $ref: '#/components/schemas/MessageResponse' }, { type: object, required: [organizaciones], properties: { organizaciones: { type: array, items: { $ref: '#/components/schemas/Organizacion' } } } }] }
    AplicacionResponse: { allOf: [{ $ref: '#/components/schemas/MessageResponse' }, { type: object, required: [aplicaciones], properties: { aplicaciones: { type: array, items: { $ref: '#/components/schemas/Aplicacion' } } } }] }
    ModuloResponse: { allOf: [{ $ref: '#/components/schemas/MessageResponse' }, { type: object, required: [modulos], properties: { modulos: { type: array, items: { $ref: '#/components/schemas/Modulo' } } } }] }
    FuncionalidadResponse: { allOf: [{ $ref: '#/components/schemas/MessageResponse' }, { type: object, required: [funcionalidades], properties: { funcionalidades: { type: array, items: { $ref: '#/components/schemas/Funcionalidad' } } } }] }
    ParametroResponse: { allOf: [{ $ref: '#/components/schemas/MessageResponse' }, { type: object, required: [parametros], properties: { parametros: { type: array, items: { $ref: '#/components/schemas/Parametro' } } } }] }
    MetadatoResponse: { allOf: [{ $ref: '#/components/schemas/MessageResponse' }, { type: object, required: [metadatos], properties: { metadatos: { type: array, items: { $ref: '#/components/schemas/Metadato' } } } }] }
    TipoParametroResponse: { allOf: [{ $ref: '#/components/schemas/MessageResponse' }, { type: object, required: [tiposParametro], properties: { tiposParametro: { type: array, items: { $ref: '#/components/schemas/TipoParametro' } } } }] }
    TipoMetadatoResponse: { allOf: [{ $ref: '#/components/schemas/MessageResponse' }, { type: object, required: [tiposMetadato], properties: { tiposMetadato: { type: array, items: { $ref: '#/components/schemas/TipoMetadato' } } } }] }

    AmbienteRequest:
      type: object
      description: Nombre del catálogo. El backend recorta espacios y valida duplicados; actualmente no valida longitud ni obligatoriedad.
      properties:
        nombre: { type: string, nullable: true, example: Desarrollo }
    Ambiente:
      type: object
      required: [id, nombre]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        nombre: { type: string, example: Desarrollo }
