openapi: 3.0.3
info:
  title: Catálogo de Parámetros UcoLab
  version: 1.1.0
  description: |
    Contrato público y versionado del módulo Catálogo de Parámetros.
    Contrato revisado contra los 12 controladores actuales: 68 operaciones de negocio.
    Incluye CRUD, consultas de catálogos, cambios de estado y 10 flujos SSE.
    Las fechas son opcionales; cuando se envían deben incluir desplazamiento horario.
    Los cambios de estado usan un booleano JSON; los DTO de alta/edición de los
    recursos originales reciben activo/activa como cadena.
    Las respuestas de errores contienen mensajes y pueden incluir la colección del recurso vacía.
    Los endpoints técnicos de Actuator y springdoc se describen en README.md.
servers:
  - url: http://localhost:8080
    description: Desarrollo local
tags:
  - name: Organizaciones
  - name: Aplicaciones
  - name: Módulos
  - name: Funcionalidades
  - name: Parámetros
  - name: Metadatos
  - name: Tipos de parámetro
  - name: Tipos de metadato

  - name: Ambientes
  - name: Estados de ambiente
  - name: Estados de metadato de ambiente
  - name: Metadatos de ambiente

paths:
  /catalogo-parametros/api/v1/organizaciones:
    get:
      tags: [Organizaciones]
      operationId: consultarOrganizaciones
      summary: Consulta organizaciones paginadas
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/OrganizacionesOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Organizaciones]
      operationId: crearOrganizacion
      summary: Crea una organización
      requestBody:
        $ref: '#/components/requestBodies/OrganizacionRequest'
      responses:
        '201': { description: Operación exitosa; la colección está vacía, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizacionResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
