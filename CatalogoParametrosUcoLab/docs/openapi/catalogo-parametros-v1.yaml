  /catalogo-parametros/api/v1/parametros/{id}/cambiarestado:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Parámetros]
      operationId: cambiarEstadoParametro
      summary: Cambia únicamente el estado activo del parámetro
      requestBody: { $ref: '#/components/requestBodies/CambiarEstadoRequest' }
