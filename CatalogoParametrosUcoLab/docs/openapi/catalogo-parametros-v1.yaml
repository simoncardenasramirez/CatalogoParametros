  /catalogo-parametros/api/v1/funcionalidades/{id}/cambiarestado:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Funcionalidades]
      operationId: cambiarEstadoFuncionalidad
      summary: Cambia únicamente el estado activo de la funcionalidad
