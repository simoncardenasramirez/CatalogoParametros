  /catalogo-parametros/api/v1/estados-metadato-ambiente/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Estados de metadato de ambiente]
      operationId: consultarEstadoMetadatoAmbientePorId
      summary: Consulta un estado de metadato de ambiente por UUID
      responses: { '200': { $ref: '#/components/responses/EstadosMetadatoAmbienteOk' }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      tags: [Estados de metadato de ambiente]
      operationId: actualizarEstadoMetadatoAmbiente
      summary: Actualiza un estado de metadato de ambiente
      requestBody: { $ref: '#/components/requestBodies/NombreRequest' }
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      tags: [Estados de metadato de ambiente]
      operationId: eliminarEstadoMetadatoAmbiente
      summary: Elimina un estado de metadato de ambiente
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/NotFound' } }

  /catalogo-parametros/api/v1/metadatos-ambiente/events:
    get:
      tags: [Metadatos de ambiente]
      operationId: consultarEventosMetadatosAmbiente
      summary: Suscribirse a eventos de metadatos de ambiente
      responses: { '200': { $ref: '#/components/responses/EventStream' } }
  /catalogo-parametros/api/v1/metadatos-ambiente:
    get:
      tags: [Metadatos de ambiente]
      operationId: consultarMetadatosAmbiente
      summary: Consulta metadatos de ambiente paginados
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { $ref: '#/components/responses/MetadatosAmbienteOk' } }
    post:
      tags: [Metadatos de ambiente]
      operationId: crearMetadatoAmbiente
      summary: Crea un metadato de ambiente
      requestBody: { $ref: '#/components/requestBodies/MetadatoAmbienteRequest' }
      responses: { '201': { $ref: '#/components/responses/Created' }, '400': { $ref: '#/components/responses/BadRequest' } }
  /catalogo-parametros/api/v1/metadatos-ambiente/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Metadatos de ambiente]
      operationId: consultarMetadatoAmbientePorId
      summary: Consulta un metadato de ambiente por UUID
      responses: { '200': { $ref: '#/components/responses/MetadatosAmbienteOk' }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      tags: [Metadatos de ambiente]
      operationId: actualizarMetadatoAmbiente
      summary: Actualiza un metadato de ambiente
      requestBody: { $ref: '#/components/requestBodies/MetadatoAmbienteRequest' }
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      tags: [Metadatos de ambiente]
      operationId: eliminarMetadatoAmbiente
      summary: Elimina un metadato de ambiente
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/NotFound' } }

  /catalogo-parametros/api/v1/tokens:
    get:
      tags: [Tokens]
      operationId: consultarTokens
      summary: Consulta tokens registrados
      responses: { '200': { $ref: '#/components/responses/TokensOk' } }
    post:
      tags: [Tokens]
      operationId: crearToken
      summary: Crea un token y almacena únicamente su hash
      requestBody: { $ref: '#/components/requestBodies/TokenRequest' }
      responses: { '201': { $ref: '#/components/responses/TokensOk' }, '400': { $ref: '#/components/responses/BadRequest' } }
  /catalogo-parametros/api/v1/tokens/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Tokens]
      operationId: consultarTokenPorId
      summary: Consulta un token por UUID
      responses: { '200': { $ref: '#/components/responses/TokensOk' }, '404': { $ref: '#/components/responses/NotFound' } }
  /catalogo-parametros/api/v1/tokens/{id}/estado:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Tokens]
      operationId: actualizarEstadoToken
      summary: Actualiza el estado de un token
      requestBody: { $ref: '#/components/requestBodies/EstadoTokenRequest' }
      responses: { '200': { $ref: '#/components/responses/TokensOk' }, '400': { $ref: '#/components/responses/BadRequest' }, '404': { $ref: '#/components/responses/NotFound' } }
  /catalogo-parametros/api/v1/tokens/{id}/validar:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Tokens]
      operationId: validarToken
      summary: Valida el secreto, estado y expiración de un token
      requestBody: { $ref: '#/components/requestBodies/ValidarTokenRequest' }
      responses: { '200': { $ref: '#/components/responses/ValidarTokenOk' }, '400': { $ref: '#/components/responses/BadRequest' }, '404': { $ref: '#/components/responses/NotFound' } }
  /catalogo-parametros/api/v1/tokens/{id}/parametros:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Tokens]
      operationId: consultarParametrosPorToken
      summary: Consulta los parámetros autorizados por un token
      responses: { '200': { $ref: '#/components/responses/ParametrosTokenOk' }, '404': { $ref: '#/components/responses/NotFound' } }

  /catalogo-parametros/api/v1/estados-token:
    get:
      tags: [Estados de token]
      operationId: consultarEstadosToken
      summary: Consulta estados de token
      responses: { '200': { $ref: '#/components/responses/EstadosTokenOk' } }
  /catalogo-parametros/api/v1/estados-token/{id}:
    get:
      tags: [Estados de token]
      operationId: consultarEstadoTokenPorId
      summary: Consulta un estado de token por UUID
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/EstadosTokenOk' }, '404': { $ref: '#/components/responses/NotFound' } }

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identificador UUID del recurso
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      description: Página basada en uno
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      description: Cantidad máxima de registros solicitados
      schema: { type: integer, minimum: 1, default: 10 }
    IdParametro:
      name: idParametro
      in: query
      required: false
      description: Filtra metadatos por el UUID del parametro
      schema: { type: string, format: uuid }
  requestBodies:
    CambiarEstadoRequest:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CambiarEstadoRequest' }
    OrganizacionRequest:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrganizacionRequest' }
    AplicacionRequest:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AplicacionRequest' }
    ModuloRequest:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ModuloRequest' }
    FuncionalidadRequest:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FuncionalidadRequest' }
    ParametroRequest:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ParametroRequest' }
    MetadatoRequest:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MetadatoRequest' }
    NombreRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [nombre]
            properties: { nombre: { type: string, minLength: 1 } }
    MetadatoAmbienteRequest:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MetadatoAmbienteRequest' }
    TokenRequest:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TokenRequest' }
    EstadoTokenRequest:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EstadoTokenRequest' }
    ValidarTokenRequest:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidarTokenRequest' }
  responses:
    Success:
      description: Operación exitosa
      content: { application/json: { schema: { $ref: '#/components/schemas/MessageResponse' } } }
    Created:
      description: Recurso creado
      content: { application/json: { schema: { $ref: '#/components/schemas/MessageResponse' } } }
    BadRequest:
      description: Petición inválida o regla de negocio incumplida
      content: { application/json: { schema: { $ref: '#/components/schemas/MessageResponse' } } }
    NotFound:
      description: Recurso no encontrado
      content: { application/json: { schema: { $ref: '#/components/schemas/MessageResponse' } } }
    Conflict:
      description: Conflicto con el estado actual del catálogo
      content: { application/json: { schema: { $ref: '#/components/schemas/MessageResponse' } } }
    InternalError:
      description: Error técnico no esperado
      content: { application/json: { schema: { $ref: '#/components/schemas/MessageResponse' } } }
    EventStream:
      description: Conexión SSE. El campo `event` del JSON vale CREATED, UPDATED o DELETED.
      content:
        text/event-stream:
          schema: { type: string }
          example: "event: parametro\ndata: {\"parametro\":{\"id\":\"123e4567-e89b-12d3-a456-426614174000\",\"nombre\":\"idioma\",\"idFuncionalidad\":\"123e4567-e89b-12d3-a456-426614174001\",\"idTipoParametro\":\"123e4567-e89b-12d3-a456-426614174002\",\"activo\":true},\"event\":\"CREATED\"}\n\n"
    OrganizacionesOk: { description: Organizaciones encontradas, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizacionResponse' } } } }
    AplicacionesOk: { description: Aplicaciones encontradas, content: { application/json: { schema: { $ref: '#/components/schemas/AplicacionResponse' } } } }
    ModulosOk: { description: Módulos encontrados, content: { application/json: { schema: { $ref: '#/components/schemas/ModuloResponse' } } } }
    FuncionalidadesOk: { description: Funcionalidades encontradas, content: { application/json: { schema: { $ref: '#/components/schemas/FuncionalidadResponse' } } } }
    ParametrosOk: { description: Parámetros encontrados, content: { application/json: { schema: { $ref: '#/components/schemas/ParametroResponse' } } } }
    MetadatosOk: { description: Metadatos encontrados, content: { application/json: { schema: { $ref: '#/components/schemas/MetadatoResponse' } } } }
    TiposParametroOk: { description: Tipos encontrados, content: { application/json: { schema: { $ref: '#/components/schemas/TipoParametroResponse' } } } }
    TiposMetadatoOk: { description: Tipos encontrados, content: { application/json: { schema: { $ref: '#/components/schemas/TipoMetadatoResponse' } } } }
    AmbientesOk: { description: Ambientes encontrados, content: { application/json: { schema: { $ref: '#/components/schemas/AmbienteResponse' } } } }
    EstadosAmbienteOk: { description: Estados de ambiente encontrados, content: { application/json: { schema: { $ref: '#/components/schemas/EstadoAmbienteResponse' } } } }
    EstadosMetadatoAmbienteOk: { description: Estados de metadato de ambiente encontrados, content: { application/json: { schema: { $ref: '#/components/schemas/EstadoMetadatoAmbienteResponse' } } } }
    MetadatosAmbienteOk: { description: Metadatos de ambiente encontrados, content: { application/json: { schema: { $ref: '#/components/schemas/MetadatoAmbienteResponse' } } } }
    TokensOk: { description: Tokens encontrados, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }
    EstadosTokenOk: { description: Estados de token encontrados, content: { application/json: { schema: { $ref: '#/components/schemas/EstadoTokenResponse' } } } }
    ValidarTokenOk: { description: Resultado de validacion, content: { application/json: { schema: { $ref: '#/components/schemas/ValidarTokenResponse' } } } }
    ParametrosTokenOk: { description: Parametros autorizados, content: { application/json: { schema: { $ref: '#/components/schemas/ParametrosTokenResponse' } } } }
  schemas:
    CambiarEstadoRequest:
      type: object
      required: [activo]
      properties:
        activo: { type: boolean, example: false }
    Uuid:
      type: string
      format: uuid
      example: 123e4567-e89b-12d3-a456-426614174000
    InputUuid:
      type: string
      format: uuid
      description: Los DTO actuales reciben el UUID como cadena JSON.
      example: 123e4567-e89b-12d3-a456-426614174000
    InputBoolean:
      type: string
      enum: ['true', 'false']
      default: 'true'
      description: Los DTO actuales reciben el booleano como cadena JSON.
    InputDateTime:
      type: string
      format: date-time
      description: Fecha y hora ISO-8601 con desplazamiento obligatorio; se recomienda enviar la zona de Colombia como -05:00.
      example: '2026-09-11T08:30:00-05:00'
    MessageResponse:
      type: object
      required: [mensajes]
      properties:
        mensajes: { type: array, items: { type: string } }
    Ambiente:
      type: object
      required: [id, nombre]
      properties: { id: { $ref: '#/components/schemas/Uuid' }, nombre: { type: string } }
    EstadoAmbiente:
      type: object
      required: [id, nombre]
      properties: { id: { $ref: '#/components/schemas/Uuid' }, nombre: { type: string } }
    EstadoMetadatoAmbiente:
      type: object
      required: [id, nombre]
      properties: { id: { $ref: '#/components/schemas/Uuid' }, nombre: { type: string } }
    MetadatoAmbiente:
      type: object
      required: [id, idParametro, idAmbiente, idEstadoMetadatoAmbiente]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        idParametro: { $ref: '#/components/schemas/Uuid' }
        idAmbiente: { $ref: '#/components/schemas/Uuid' }
        idEstadoMetadatoAmbiente: { $ref: '#/components/schemas/Uuid' }
    MetadatoAmbienteRequest:
      type: object
      required: [idParametro, idAmbiente, idEstadoMetadatoAmbiente]
      properties:
        idParametro: { $ref: '#/components/schemas/InputUuid' }
        idAmbiente: { $ref: '#/components/schemas/InputUuid' }
        idEstadoMetadatoAmbiente: { $ref: '#/components/schemas/InputUuid' }
    TokenRequest:
      type: object
      required: [token, estadoToken, aplicacionId, ambienteId, fechaExpiracion]
      properties:
        token: { type: string, minLength: 1, writeOnly: true }
        estadoToken: { $ref: '#/components/schemas/InputUuid' }
        aplicacionId: { $ref: '#/components/schemas/InputUuid' }
        ambienteId: { $ref: '#/components/schemas/InputUuid' }
        fechaExpiracion: { $ref: '#/components/schemas/InputDateTime' }
    EstadoTokenRequest:
      type: object
      required: [estadoToken]
      properties: { estadoToken: { $ref: '#/components/schemas/InputUuid' } }
    ValidarTokenRequest:
      type: object
      required: [token]
      properties: { token: { type: string, minLength: 1, writeOnly: true } }
    Token:
      type: object
      required: [id, estadoToken, aplicacionId, ambienteId, fechaCreacion, fechaExpiracion]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        estadoToken: { $ref: '#/components/schemas/Uuid' }
        aplicacionId: { $ref: '#/components/schemas/Uuid' }
        ambienteId: { $ref: '#/components/schemas/Uuid' }
        fechaCreacion: { type: string, format: date-time }
        fechaExpiracion: { type: string, format: date-time }
    EstadoToken:
      type: object
      required: [id, estado]
      properties: { id: { $ref: '#/components/schemas/Uuid' }, estado: { type: string } }
    ValidarTokenResponse:
      allOf: [{ $ref: '#/components/schemas/MessageResponse' }, { type: object, required: [valido], properties: { valido: { type: boolean } } }]
    ParametrosTokenResponse:
      allOf: [{ $ref: '#/components/schemas/MessageResponse' }, { type: object, required: [aplicacion, ambiente, parametros], properties: { aplicacion: { $ref: '#/components/schemas/Aplicacion' }, ambiente: { $ref: '#/components/schemas/Ambiente' }, parametros: { type: array, items: { $ref: '#/components/schemas/Parametro' } } } }]
    OrganizacionRequest:
      type: object
      additionalProperties: false
      required: [nombre, fechaInicio, fechaFinal]
      properties:
        nombre: { type: string, minLength: 1, example: UCO }
        fechaInicio: { $ref: '#/components/schemas/InputDateTime' }
        fechaFinal: { $ref: '#/components/schemas/InputDateTime' }
    AplicacionRequest:
      type: object
      additionalProperties: false
      required: [nombre, idOrganizacion, activa, fechaInicio, fechaFinal]
      properties:
        nombre: { type: string, minLength: 1, example: UcoLab }
        idOrganizacion: { $ref: '#/components/schemas/InputUuid' }
        activa: { $ref: '#/components/schemas/InputBoolean' }
        fechaInicio: { $ref: '#/components/schemas/InputDateTime' }
        fechaFinal: { $ref: '#/components/schemas/InputDateTime' }
    ModuloRequest:
      type: object
      additionalProperties: false
      required: [nombre, idAplicacion, activo, fechaInicio, fechaFinal]
      properties:
        nombre: { type: string, minLength: 1, example: Matrículas }
        idAplicacion: { $ref: '#/components/schemas/InputUuid' }
        activo: { $ref: '#/components/schemas/InputBoolean' }
        fechaInicio: { $ref: '#/components/schemas/InputDateTime' }
        fechaFinal: { $ref: '#/components/schemas/InputDateTime' }
    FuncionalidadRequest:
      type: object
      additionalProperties: false
      required: [nombre, idModulo, activo, fechaInicio, fechaFinal]
      properties:
        nombre: { type: string, minLength: 1, example: Crear matrícula }
        idModulo: { $ref: '#/components/schemas/InputUuid' }
        activo: { $ref: '#/components/schemas/InputBoolean' }
        fechaInicio: { $ref: '#/components/schemas/InputDateTime' }
        fechaFinal: { $ref: '#/components/schemas/InputDateTime' }
    ParametroRequest:
      type: object
      additionalProperties: false
      required: [nombre, idFuncionalidad, idTipoParametro, activo]
      properties:
        nombre: { type: string, minLength: 1, example: idioma }
        idFuncionalidad: { $ref: '#/components/schemas/InputUuid' }
        idTipoParametro: { $ref: '#/components/schemas/InputUuid' }
        activo: { $ref: '#/components/schemas/InputBoolean' }
    MetadatoRequest:
      type: object
      additionalProperties: false
      required: [idParametro, idTipoMetadato, idAmbiente, valor]
      properties:
        idParametro: { $ref: '#/components/schemas/InputUuid' }
        idTipoMetadato: { $ref: '#/components/schemas/InputUuid' }
        idAmbiente: { $ref: '#/components/schemas/InputUuid' }
        valor:
          description: JSON cuyo tipo debe coincidir con el tipo de metadato asociado.
    Organizacion:
      type: object
      required: [id, nombre]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        nombre: { type: string }
        fechaInicio: { type: string, format: date-time, nullable: true, example: '2026-09-11T13:30:00Z' }
        fechaFinal: { type: string, format: date-time, nullable: true, example: '2026-12-31T04:59:59Z' }
    Aplicacion:
      type: object
      required: [id, nombre, idOrganizacion, activa]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        nombre: { type: string }
        idOrganizacion: { $ref: '#/components/schemas/Uuid' }
        activa: { type: boolean }
        fechaInicio: { type: string, format: date-time, nullable: true, example: '2026-09-11T13:30:00Z' }
        fechaFinal: { type: string, format: date-time, nullable: true, example: '2026-12-31T04:59:59Z' }
    Modulo:
      type: object
      required: [id, nombre, idAplicacion, activo]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        nombre: { type: string }
        idAplicacion: { $ref: '#/components/schemas/Uuid' }
        activo: { type: boolean }
        fechaInicio: { type: string, format: date-time, nullable: true, example: '2026-09-11T13:30:00Z' }
        fechaFinal: { type: string, format: date-time, nullable: true, example: '2026-12-31T04:59:59Z' }
    Funcionalidad:
      type: object
      required: [id, nombre, idModulo, activo]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        nombre: { type: string }
        idModulo: { $ref: '#/components/schemas/Uuid' }
        activo: { type: boolean }
        fechaInicio: { type: string, format: date-time, nullable: true, example: '2026-09-11T13:30:00Z' }
        fechaFinal: { type: string, format: date-time, nullable: true, example: '2026-12-31T04:59:59Z' }
    Parametro:
      type: object
      required: [id, nombre, idFuncionalidad, idTipoParametro, activo]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        nombre: { type: string }
        idFuncionalidad: { $ref: '#/components/schemas/Uuid' }
        idTipoParametro: { $ref: '#/components/schemas/Uuid' }
        activo: { type: boolean }
    Metadato:
      type: object
      required: [id, idParametro, idTipoMetadato, idAmbiente, valor]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        idParametro: { $ref: '#/components/schemas/Uuid' }
        idTipoMetadato: { $ref: '#/components/schemas/Uuid' }
        idAmbiente:
          type: string
          format: uuid
          nullable: true
          description: Obligatorio al escribir. Historicos sin ambiente requieren asignacion y no se entregan por token.
        valor: { description: Valor JSON tipado por idTipoMetadato }
    TipoParametro:
      type: object
      required: [id, nombre]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        nombre: { type: string }
    TipoMetadato:
      type: object
      required: [id, tipo, detalle]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        tipo: { type: string, example: STRING }
        detalle: { type: string }
    AmbienteResponse: { allOf: [{ $ref: '#/components/schemas/MessageResponse' }, { type: object, required: [ambientes], properties: { ambientes: { type: array, items: { $ref: '#/components/schemas/Ambiente' } } } }] }
    EstadoAmbienteResponse: { allOf: [{ $ref: '#/components/schemas/MessageResponse' }, { type: object, required: [estadosAmbiente], properties: { estadosAmbiente: { type: array, items: { $ref: '#/components/schemas/EstadoAmbiente' } } } }] }
    EstadoMetadatoAmbienteResponse: { allOf: [{ $ref: '#/components/schemas/MessageResponse' }, { type: object, required: [estadosMetadatoAmbiente], properties: { estadosMetadatoAmbiente: { type: array, items: { $ref: '#/components/schemas/EstadoMetadatoAmbiente' } } } }] }
    MetadatoAmbienteResponse: { allOf: [{ $ref: '#/components/schemas/MessageResponse' }, { type: object, required: [metadatosAmbiente], properties: { metadatosAmbiente: { type: array, items: { $ref: '#/components/schemas/MetadatoAmbiente' } } } }] }
    TokenResponse: { allOf: [{ $ref: '#/components/schemas/MessageResponse' }, { type: object, required: [tokens], properties: { tokens: { type: array, items: { $ref: '#/components/schemas/Token' } } } }] }
