apiVersion: 1

datasources:
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    isDefault: false
    editable: true
    jsonData:
      tracesToLogs:
        datasourceUid: loki
        tags: ['traceID']
        mappedTags: [{ key: 'traceId', value: 'traceID' }]
      tracesToMetrics:
        datasourceUid: prometheus
        tags: [{ key: 'service.name', value: 'service' }, { key: 'operation' }]
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
