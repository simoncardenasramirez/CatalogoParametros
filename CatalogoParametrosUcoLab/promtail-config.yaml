server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  - job_name: docker

    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:

      # SOLO recoger logs de tu aplicación
      - source_labels: [__meta_docker_container_name]
        regex: /catalogo-parametros-app
        action: keep

      # Nombre que tendrá el contenedor en Loki
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container_name

      # Mantener solo stdout
      - source_labels: [__meta_docker_container_log_stream]
        regex: stdout
        action: keep

  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*.log