spring.application.name=${application-name}

# Redis: estrategia cache -> SurrealDB para el catalogo de parametros.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s
spring.data.redis.repositories.enabled=false
catalogo.cache.habilitada=${CACHE_HABILITADA:true}
catalogo.cache.ttl=${CACHE_TTL:5m}
catalogo.cache.prefijo=${CACHE_PREFIJO:catalogo-parametros}

# Swagger UI / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.paths-to-match=/catalogo-parametros/api/v1/**
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# ==========================================
# Azure Key Vault
# ==========================================

spring.cloud.azure.keyvault.secret.property-sources[0].endpoint=https://parametersucolab.vault.azure.net/
azure.keyvault.client.endpoint=https://parametersucolab.vault.azure.net/

# ==========================================
# SurrealDB
# ==========================================


surrealdb.url=${surrealdb-url}
surrealdb.namespace=${surrealdb-namespace}
surrealdb.database=${surrealdb-database}
surrealdb.username=${surrealdb-username}
surrealdb.password=${surrealdb-password}


# ==========================================
# OpenTelemetry / Tracing
# ==========================================

management.tracing.sampling.probability=1.0

# WebFlux ejecuta parte del flujo en otros hilos (por ejemplo, boundedElastic).
# Esta opción conserva el contexto de OpenTelemetry y el MDC entre esos cambios.
spring.reactor.context-propagation=auto

# Los casos de uso y reglas implementan puertos; los proxies JDK permiten
# instrumentar también implementaciones declaradas final.
spring.aop.proxy-target-class=false

management.opentelemetry.tracing.export.otlp.endpoint=http://otel-collector:4317
management.opentelemetry.tracing.export.otlp.transport=grpc

management.opentelemetry.resource-attributes.service.name=catalogo-parametros


# ==========================================
# Actuator
# ==========================================

management.endpoints.web.exposure.include=health,info,prometheus

management.endpoint.health.show-details=always


# ==========================================
# Prometheus
# ==========================================

management.metrics.export.prometheus.enabled=true


# ==========================================
# Logging
# ==========================================

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [traceId=%X{traceId:-},spanId=%X{spanId:-}] - %msg%n

logging.pattern.correlation=[traceId=%X{traceId},spanId=%X{spanId}]

logging.level.co.edu.uco.CatalogoParametrosUcoLab=DEBUG

security.enabled=true
security.pep.enforcement.enabled=true
security.pep.enforcement.pep-url=${PEP_URL:http://localhost:18081}
security.pep.enforcement.application-name=${SECURITY_APPLICATION_NAME:Catalogo}
security.pep.enforcement.environment=${SECURITY_ENVIRONMENT:dev}
security.pep.enforcement.application-credential=${PEP_REGISTRATION_TOKEN}
security.pep.enforcement.allow-insecure-http=${PEP_ALLOW_INSECURE_HTTP:false}
# Esta consulta autentica con el token propio del catalogo en TokenController.
security.pep.enforcement.public-paths=/actuator/health,/catalogo-parametros/api/v1/tokens/{id}/parametros
server.port=8080
# Reconciliacion persistida; las reglas de uso validan vigencia tambien en cada operacion.
catalogo.vigencia.habilitada=true
catalogo.vigencia.intervalo=${CATALOGO_VIGENCIA_INTERVALO:60000}
catalogo.vigencia.demora-inicial=10000
# Origenes exactos; el filtro CORS tambien cubre rechazos del PEP.
catalogo.security.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:http://localhost:4200}
