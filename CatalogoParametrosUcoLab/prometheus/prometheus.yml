
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'catalogo-parametros'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['app:8080']
    scheme: http

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
    scheme: http
 