# Azure DevOps Pipeline for CatalogoParametrosUcoLab
# 
# PREREQUISITES - Configure these in Azure DevOps before running:
# 
# 1. Service Connections:
#    - Azure Resource Manager service connection named "azure-subscription"
#      (used for AZURE_SUBSCRIPTION variable)
#    - Docker Registry service connection named "azure-container-registry"
#      (pointing to parametersucolab.azurecr.io)
#
# 2. Variable Group (optional but recommended):
#    - Create a variable group with: AZURE_SUBSCRIPTION, RESOURCE_GROUP,
#      APP_NAME, KEY_VAULT_NAME, CONTAINER_REGISTRY_LOGIN_SERVER
#
# 3. Azure Resources:
#    - Resource Group: catalogo-parametros-rg
#    - App Service (Linux, Docker): catalogo-parametros-app
#    - Azure Container Registry: parametersucolab.azurecr.io
#    - Key Vault: parametersucolab (with secrets for SurrealDB and app config)
#
# 4. Agent Pool:
#    - Ensure the pipeline uses an agent with Docker capability
#      (ubuntu-latest has Docker pre-installed)

trigger:
  branches:
    include:
      - main
      - master
      - develop

pr:
  branches:
    include:
      - main
      - master
      - develop

variables:
  # Java
  JAVA_VERSION: '21'

  # Docker
  IMAGE_NAME: 'catalogoparametrosucolab'
  DOCKER_REGISTRY_SERVICE_CONNECTION: 'azure-container-registry'
  CONTAINER_REGISTRY_LOGIN_SERVER: 'parametersucolab.azurecr.io'

  # Azure
  AZURE_SUBSCRIPTION: 'azure-subscription'
  RESOURCE_GROUP: 'catalogo-parametros-rg'
  APP_NAME: 'catalogo-parametros-app'
  KEY_VAULT_NAME: 'parametersucolab'

  # Application
  APPLICATION_NAME: 'CatalogoParametrosUcoLab'

stages:
  - stage: Build
    displayName: 'Build and Test'
    jobs:
      - job: BuildBackend
        displayName: 'Build Backend with Maven'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Maven@3
            displayName: 'Build with Maven'
            inputs:
              mavenPomFile: 'CatalogoParametrosUcoLab/pom.xml'
              mavenOptions: '-Xmx3072m'
              javaHomeOption: 'JDKVersion'
              javaVersionOption: '$(JAVA_VERSION)'
              jdkArchitectureOption: 'x64'
              goals: 'clean package -DskipTests'
              workingDirectory: 'CatalogoParametrosUcoLab'

          - task: Maven@3
            displayName: 'Run Tests'
            inputs:
              mavenPomFile: 'CatalogoParametrosUcoLab/pom.xml'
              mavenOptions: '-Xmx3072m'
              javaHomeOption: 'JDKVersion'
              javaVersionOption: '$(JAVA_VERSION)'
              jdkArchitectureOption: 'x64'
              goals: 'test'
              workingDirectory: 'CatalogoParametrosUcoLab'

          - task: PublishTestResults@2
            displayName: 'Publish Test Results'
            inputs:
              testResultsFormat: 'surefire'
              testResultsFiles: 'CatalogoParametrosUcoLab/**/TEST-*.xml'
              searchFolder: '$(System.DefaultWorkingDirectory)'
            condition: succeededOrFailed()

          - task: PublishCodeCoverageResults@1
            displayName: 'Publish Code Coverage'
            inputs:
              codeCoverageTool: 'JaCoCo'
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/CatalogoParametrosUcoLab/target/site/jacoco/jacoco.xml'
              reportDirectoryLocation: '$(System.DefaultWorkingDirectory)/CatalogoParametrosUcoLab/target/site/jacoco'
            condition: succeededOrFailed()

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Artifact - JAR'
            inputs:
              PathtoPublish: '$(System.DefaultWorkingDirectory)/CatalogoParametrosUcoLab/target/$(APPLICATION_NAME)-0.0.1-SNAPSHOT.jar'
              ArtifactName: 'drop'
              publishLocation: 'Container'

      - job: BuildFrontend
        displayName: 'Build Frontend with Angular'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js 20'
            inputs:
              versionSpec: '20.x'
              checkLatest: true

          - script: |
              cd catalogo-parametros-front
              npm install
              npm run build
            displayName: 'Build Angular App'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Artifact - Frontend'
            inputs:
              PathtoPublish: '$(System.DefaultWorkingDirectory)/catalogo-parametros-front/dist/catalogo-parametros-front'
              ArtifactName: 'frontend'
              publishLocation: 'Container'

  - stage: BuildDockerImage
    displayName: 'Build and Push Docker Image'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: BuildDocker
        displayName: 'Build Docker Image'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: DownloadBuildArtifacts@0
            displayName: 'Download Build Artifacts'
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'drop'
              downloadPath: '$(System.ArtifactsDirectory)/drop'

          - script: |
              mkdir -p $(System.DefaultWorkingDirectory)/CatalogoParametrosUcoLab/target
              cp $(System.ArtifactsDirectory)/drop/$(APPLICATION_NAME)-0.0.1-SNAPSHOT.jar $(System.DefaultWorkingDirectory)/CatalogoParametrosUcoLab/target/
            displayName: 'Place JAR in target directory'

          - task: Docker@2
            displayName: 'Build and Push Docker Image'
            inputs:
              command: 'buildAndPush'
              repository: '$(CONTAINER_REGISTRY_LOGIN_SERVER)/$(IMAGE_NAME)'
              dockerfile: 'CatalogoParametrosUcoLab/Dockerfile'
              tags: |
                $(Build.BuildId)
                latest
              buildContext: '$(System.DefaultWorkingDirectory)/CatalogoParametrosUcoLab'
              containerRegistry: '$(DOCKER_REGISTRY_SERVICE_CONNECTION)'

  - stage: Deploy
    displayName: 'Deploy to Azure'
    dependsOn: BuildDockerImage
    condition: succeeded()
    jobs:
      - deployment: DeployToAzure
        displayName: 'Deploy to Azure App Service'
        environment: 'production'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureKeyVault@2
                  displayName: 'Fetch Secrets from Azure Key Vault'
                  inputs:
                    azureSubscription: '$(AZURE_SUBSCRIPTION)'
                    KeyVaultName: '$(KEY_VAULT_NAME)'
                    SecretsFilter: '*'
                    RunAsPreJob: true

                - task: AzureCLI@2
                  displayName: 'Deploy to Azure App Service (Linux)'
                  inputs:
                    azureSubscription: '$(AZURE_SUBSCRIPTION)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az webapp config container set \
                        --resource-group $(RESOURCE_GROUP) \
                        --name $(APP_NAME) \
                        --docker-custom-image-name $(CONTAINER_REGISTRY_LOGIN_SERVER)/$(IMAGE_NAME):$(Build.BuildId)

                - task: AzureCLI@2
                  displayName: 'Configure App Settings'
                  inputs:
                    azureSubscription: '$(AZURE_SUBSCRIPTION)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az webapp config appsettings set \
                        --resource-group $(RESOURCE_GROUP) \
                        --name $(APP_NAME) \
                        --settings \
                        application-name=$(APPLICATION_NAME) \
                        MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,prometheus \
                        MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED=true

                - task: AzureAppServiceManage@1
                  displayName: 'Restart App Service'
                  inputs:
                    azureSubscription: '$(AZURE_SUBSCRIPTION)'
                    appName: '$(APP_NAME)'
                    resourceGroupName: '$(RESOURCE_GROUP)'
                    action: 'restart'
