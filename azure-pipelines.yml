trigger:
  - main

pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:

  dockerRegistryServiceConnection: 'DockerHubConnection'

  imageRepository: 'simon4219/catalogo-parametros'

  dockerfilePath: '$(Build.SourcesDirectory)/CatalogoParametrosUcoLab/Dockerfile'

  buildContext: '$(Build.SourcesDirectory)/CatalogoParametrosUcoLab'

  tag: '$(Build.BuildId)'

steps:

- task: Docker@2
  displayName: 'Construir y publicar imagen Docker'

  inputs:

    command: 'buildAndPush'

    containerRegistry: '$(dockerRegistryServiceConnection)'

    repository: '$(imageRepository)'

    Dockerfile: '$(dockerfilePath)'

    buildContext: '$(buildContext)'

    tags: |
      $(tag)
      latest