name: catalogo-$(SourceBranchName)-$(Date:yyyyMMdd).$(Rev:r)

trigger:
  batch: true
  branches:
    include:
      - develop

pr:
  branches:
    include:
      - '*'

pool:
  vmImage: ubuntu-latest

variables:
  # Maven y Trivy comparten el repositorio local estÃ¡ndar del agente.
  MAVEN_CACHE_FOLDER: $(Build.SourcesDirectory)/.m2/repository
  SONAR_USER_HOME: $(Pipeline.Workspace)/.sonar
  TRIVY_CACHE_DIR: $(Pipeline.Workspace)/.trivy/cache
  TRIVY_VERSION: '0.74.0'
  IMAGE_VERSION_PREFIX: '0.1'
  # La version se publica con su etiqueta y tambien actualiza latest.
  # El contador incrementa el parche por rama; los PR no publican imagenes.
  IMAGE_VERSION_PATCH: $[counter(format('docker-{0}-{1}', variables['IMAGE_VERSION_PREFIX'], variables['Build.SourceBranch']), 0)]

steps:
  - checkout: self
    fetchDepth: 0

  - task: JavaToolInstaller@0
    displayName: Configurar Java 25
    inputs:
      versionSpec: '25'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  - task: Cache@2
    displayName: Cache de Maven
    inputs:
      # La clave v3 evita restaurar entradas antiguas creadas con una ruta
      # absoluta fuera del workspace del agente (/home/vsts).
      key: 'maven-v3 | "$(Agent.OS)" | **/pom.xml'
      restoreKeys: |
        maven-v3 | "$(Agent.OS)"
      path: $(MAVEN_CACHE_FOLDER)

  - task: Cache@2
    displayName: Cache de Sonar
    inputs:
      key: 'sonar | "$(Agent.OS)"'
      path: $(SONAR_USER_HOME)/cache

  - task: Cache@2
    displayName: Cache de Trivy
    inputs:
      key: 'trivy | "$(Agent.OS)" | "$(TRIVY_VERSION)"'
      restoreKeys: |
        trivy | "$(Agent.OS)"
      path: $(TRIVY_CACHE_DIR)

  - bash: |
      set -euo pipefail

      paquete_trivy="$(Agent.TempDirectory)/trivy_$(TRIVY_VERSION)_Linux-64bit.deb"

      wget --quiet \
        --output-document "$paquete_trivy" \
        "https://github.com/aquasecurity/trivy/releases/download/v$(TRIVY_VERSION)/trivy_$(TRIVY_VERSION)_Linux-64bit.deb"

      sudo dpkg --install "$paquete_trivy"
      trivy --version
    displayName: Instalar Trivy $(TRIVY_VERSION)

  - bash: |
      set -euo pipefail
      # Separar el literal evita que Azure lo sustituya dentro del script.
      token_sin_resolver='$''(SONAR_TOKEN)'
      if [[ -z "${SONAR_TOKEN:-}" || "$SONAR_TOKEN" == "$token_sin_resolver" ]]; then
        echo "##vso[task.logissue type=error]Configura SONAR_TOKEN como variable secreta del pipeline."
        exit 1
      fi
    displayName: Verificar configuraciÃ³n de Sonar
    env:
      SONAR_TOKEN: $(SONAR_TOKEN)

  - bash: |
      set -euo pipefail

      usuario="$GITHUB_PACKAGES_USER"
      token="$GITHUB_PACKAGES_TOKEN"
      usuario_sin_resolver='$''(GITHUB_PACKAGES_USER)'
      token_sin_resolver='$''(GITHUB_PACKAGES_TOKEN)'
      if [[ -z "$usuario" || -z "$token" || "$usuario" == "$usuario_sin_resolver" || "$token" == "$token_sin_resolver" ]]; then
        echo "##vso[task.logissue type=error]Configura GITHUB_PACKAGES_USER y GITHUB_PACKAGES_TOKEN como variables del pipeline; GITHUB_PACKAGES_TOKEN debe ser secreto."
        exit 1
      fi

      cat > "$(Agent.TempDirectory)/maven-settings.xml" <<'EOF'
      <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
        <servers>
          <server>
            <id>github</id>
            <username>${env.GITHUB_PACKAGES_USER}</username>
            <password>${env.GITHUB_PACKAGES_TOKEN}</password>
          </server>
        </servers>
      </settings>
      EOF
    displayName: Configurar credenciales de GitHub Packages
    env:
      GITHUB_PACKAGES_USER: $(GITHUB_PACKAGES_USER)
      GITHUB_PACKAGES_TOKEN: $(GITHUB_PACKAGES_TOKEN)

  - bash: |
      bash ./mvnw -B -ntp \
        --settings "$(Agent.TempDirectory)/maven-settings.xml" \
        "-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)" \
        dependency:resolve \
        clean verify
    displayName: Compilar, probar y exigir cobertura del 80%
    workingDirectory: $(Build.SourcesDirectory)/CatalogoParametrosUcoLab
    env:
      GITHUB_PACKAGES_USER: $(GITHUB_PACKAGES_USER)
      GITHUB_PACKAGES_TOKEN: $(GITHUB_PACKAGES_TOKEN)

  - task: PublishTestResults@2
    displayName: Publicar resultados de pruebas
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: '**/target/surefire-reports/TEST-*.xml'
      searchFolder: $(Build.SourcesDirectory)/CatalogoParametrosUcoLab
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: false

  - task: PublishCodeCoverageResults@2
    displayName: Publicar cobertura JaCoCo
    condition: succeededOrFailed()
    inputs:
      summaryFileLocation: $(Build.SourcesDirectory)/CatalogoParametrosUcoLab/target/site/jacoco/jacoco.xml
      pathToSources: $(Build.SourcesDirectory)/CatalogoParametrosUcoLab/src/main/java
      failIfCoverageEmpty: false

  - bash: |
      bash ./mvnw -B -ntp \
        --settings "$(Agent.TempDirectory)/maven-settings.xml" \
        "-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)" \
        org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
        -Dsonar.host.url=https://sonarcloud.io \
        -Dsonar.organization=simoncardenasramirez \
        -Dsonar.projectKey=simoncardenasramirez_CatalogoParametros \
        -Dsonar.qualitygate.wait=true \
        -Dsonar.qualitygate.timeout=300
    displayName: Analizar Sonar y exigir Quality Gate
    workingDirectory: $(Build.SourcesDirectory)/CatalogoParametrosUcoLab
    env:
      GITHUB_PACKAGES_USER: $(GITHUB_PACKAGES_USER)
      GITHUB_PACKAGES_TOKEN: $(GITHUB_PACKAGES_TOKEN)
      SONAR_TOKEN: $(SONAR_TOKEN)
      SONAR_USER_HOME: $(SONAR_USER_HOME)

  - bash: |
      set -euo pipefail

      trivy filesystem \
        --cache-dir "$(TRIVY_CACHE_DIR)" \
        --ignorefile .trivyignore.yaml \
        --offline-scan \
        --scanners vuln,secret,misconfig \
        --severity HIGH,CRITICAL \
        --exit-code 1 \
        .
    displayName: Analizar dependencias, secretos y configuraciÃ³n con Trivy
    workingDirectory: $(Build.SourcesDirectory)/CatalogoParametrosUcoLab

  - task: Docker@2
    displayName: Autenticarse en Docker Hub
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'), ne(variables['Build.Reason'], 'PullRequest'))
    inputs:
      command: login
      containerRegistry: DockerHubConnection

  - bash: |
      set -euo pipefail

      repositorio="simon4219/catalogo-parametros"
      version_nueva="${IMAGE_VERSION_PREFIX}.${IMAGE_VERSION_PATCH}"
      imagen_nueva="catalogo-candidato:${BUILD_BUILDID}"

      if [[ ! "$version_nueva" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
        echo "##vso[task.logissue type=error]La versiÃ³n debe tener formato X.Y.Z."
        exit 1
      fi

      # Construir primero sin modificar las imÃ¡genes de Docker Hub.
      echo "Construyendo nueva imagen..."

      docker build \
        --file Dockerfile \
        --tag "$imagen_nueva" \
        .

      # Impedir la publicaciÃ³n si la imagen contiene vulnerabilidades graves.
      echo "Analizando nueva imagen con Trivy..."

      trivy image \
        --cache-dir "$(TRIVY_CACHE_DIR)" \
        --scanners vuln,secret \
        --severity HIGH,CRITICAL \
        --exit-code 1 \
        "$imagen_nueva"

      # No sobrescribir una version historica existente.
      if docker manifest inspect "${repositorio}:${version_nueva}" > /dev/null 2>&1; then
        echo "##vso[task.logissue type=error]La version ${version_nueva} ya existe. No se sobrescribira."
        exit 1
      fi

      echo "Publicando nueva imagen como ${repositorio}:${version_nueva} y latest..."
      docker tag "$imagen_nueva" "${repositorio}:${version_nueva}"
      docker tag "$imagen_nueva" "${repositorio}:latest"
      docker push "${repositorio}:${version_nueva}"
      docker push "${repositorio}:latest"

      echo "Publicacion completada: ${repositorio}:${version_nueva} y latest"
      echo "Imagen actual: ${repositorio}:latest"
    displayName: Publicar imagen versionada y latest
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'), ne(variables['Build.Reason'], 'PullRequest'))
    workingDirectory: $(Build.SourcesDirectory)/CatalogoParametrosUcoLab

  - task: Docker@2
    displayName: Cerrar sesiÃ³n en Docker Hub
    condition: and(always(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'), ne(variables['Build.Reason'], 'PullRequest'))
    inputs:
      command: logout
      containerRegistry: DockerHubConnection


